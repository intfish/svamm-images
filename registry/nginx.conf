# Read-only front for the local registry. Sandboxes reach the registry only
# through this proxy: GET/HEAD/OPTIONS are forwarded to the registry on the
# same container's loopback; any other method (PUT/POST/PATCH/DELETE) is
# refused with 405, so `docker push` from inside a sandbox cannot modify
# images in the local registry.
server {
    listen 5001;

    location / {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 405;
        }
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
}
